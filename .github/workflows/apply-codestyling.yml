name: Auto-Fix Code Styling

on:
  pull_request:
    branches:
      - "**"

jobs:
  codestyle:
    name: Check and Fix Code Styling
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
  
      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  
      - name: Install composer dependencies
        run: |
          composer install -o -q
  
      - name: Fix code styling with Composer
        run: |
          composer fix-cs || true

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: Auto-fix code styling issues" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}
          force: true
  
      - name: Debug PR number
        run: echo "Pull Request Number: ${{ github.event.pull_request.number }}"

      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            github.issues.createComment({
              issue_number: process.env.PR_NUMBER,
              body: "Code styling issues have been fixed and committed to the PR branch automatically."
            });
          env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
